name: Render WallFrames

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/WallFrames.tsx'
      - 'src/WallRoot.tsx'
      - 'src/wall-entry.ts'
      - '.github/workflows/wallframes.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx remotion render src/wall-entry.ts WallFrames out/wallframes.mp4 --codec=h264 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: wallframes
          path: out/wallframes.mp4
          retention-days: 7
