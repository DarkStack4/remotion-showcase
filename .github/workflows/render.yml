name: Render Remotion
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx remotion render Showcase out/showcase.mp4 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: out/showcase.mp4
