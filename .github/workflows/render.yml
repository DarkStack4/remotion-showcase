name: Render Remotion
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'src/WallFrames.tsx'
      - 'src/WallRoot.tsx'
      - 'src/wall-entry.ts'
      - 'src/templates/wallframes/**'
      - '.github/workflows/wallframes.yml'
      - '.github/workflows/render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx remotion render Kinetic out/kinetic.mp4 --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: kinetic
          path: out/kinetic.mp4
